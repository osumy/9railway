name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check all Python files
        run: |
          python -m py_compile 9router.py 9router-web.py

      - name: CLI smoke test (no-token commands)
        run: |
          python 9router.py help > /dev/null
          python 9router.py reset
          python 9router.py list > /dev/null
          python 9router.py config > /dev/null
          echo "CLI OK"

      - name: Web server smoke test (login page + auth + protected)
        run: |
          python 9router-web.py --port 8989 &
          sleep 3
          # no token → login page
          curl -sf http://localhost:8989/ | grep -q "railway.com/account/tokens"
          # /api/auth says unauthenticated
          curl -sf http://localhost:8989/api/auth | grep -q '"authenticated": false'
          # /api/state is protected (401)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8989/api/state | grep -q "401"
          kill %1
          echo "WEB OK"
