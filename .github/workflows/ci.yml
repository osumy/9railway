name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check all Python files
        run: |
          python -m py_compile 9router.py 9router-tui.py 9router-web.py

      - name: CLI smoke test (help)
        run: |
          python 9router.py help > /dev/null
          python 9router.py reset
          echo "CLI OK"

      - name: TUI smoke test (exit immediately)
        run: |
          printf '0\n' | python 9router-tui.py > /dev/null
          echo "TUI OK"

      - name: Web server smoke test (start + fetch + stop)
        run: |
          python 9router-web.py --port 8989 &
          sleep 3
          curl -sf http://localhost:8989/ | grep -q "9Router Manager"
          curl -sf http://localhost:8989/api/state > /dev/null
          kill %1
          echo "WEB OK"
